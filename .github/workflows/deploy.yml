name: Deploy

# Builds the site after every "Refresh tool data" run (i.e. after every push to
# main and every scheduled status check) and keeps the result as a workflow
# artifact. The actual upload to the server is not set up yet — add it as a
# final step once the transfer method is settled.
on:
  workflow_run:
    workflows: ["Refresh tool data"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to build (rollback: pass an older SHA)'
        type: string
        default: main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `inputs` is null for workflow_run, so fall back to main
          ref: ${{ inputs.ref || 'main' }}
          # The header's "zuletzt aktualisiert" date is read from git history;
          # a shallow clone would report the checkout commit instead.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true # keeps .htaccess
          retention-days: 14

      # TODO: upload dist/ to the server.
